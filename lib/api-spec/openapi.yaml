openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /conversations/{id}/recommendations:
    post:
      operationId: recommendTechnicians
      tags: [hub]
      summary: Suggest eligible technicians using experience, stock, and Google driving routes when configured
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Advisory recommendations; never dispatches automatically
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TechnicianRecommendations" }
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          description: Conversation not found
        "409":
          description: Analyze the latest messages and choose a customer site first
  /technicians/{id}/route/{customer_site_id}:
    get:
      operationId: getTechnicianRoute
      tags: [hub]
      summary: Get the Google driving route from a technician sample position to a customer sample site
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
        - name: customer_site_id
          in: path
          required: true
          schema: { type: string, enum: [north, central, south] }
      responses:
        "200":
          description: Google driving route, or an explicit unavailable status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TechnicianRoute" }
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          description: Technician not found
  /messaging/telegram:
    get:
      operationId: getTelegramStatus
      tags: [hub]
      summary: Authenticated Telegram receiver status and verified bot link
      responses:
        "200":
          description: Receiver status without credentials or customer identifiers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelegramStatus"
  /conversations/{id}/site:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    patch:
      operationId: setConversationSite
      tags: [hub]
      summary: Explicitly choose a sample site before dispatching a Telegram request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversationSiteInput"
      responses:
        "200":
          description: Updated conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationThread"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "409":
          description: Conversation is already dispatched
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /hub-data:
    get:
      operationId: getHubData
      tags: [hub]
      summary: Current synthetic dispatch hub state
      responses:
        "200":
          description: Technicians, inventory and immutable audit log
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HubData"
  /workshop-reviews:
    get:
      operationId: listWorkshopReviews
      tags: [hub]
      summary: List saved customer reviews and the overall average star rating
      responses:
        "200":
          description: Latest 100 saved reviews and all-time average
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkshopReviewList"
    post:
      operationId: createWorkshopReview
      tags: [hub]
      summary: Save a customer star rating and written review
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkshopReviewInput"
      responses:
        "201":
          description: The saved review and updated rating summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerReview"
        "400":
          $ref: "#/components/responses/InvalidRequest"
  /workshop-reviews/summary:
    post:
      operationId: summarizeWorkshopReviews
      tags: [hub]
      summary: Generate improvement and strength themes from saved reviews using AI
      responses:
        "200":
          description: AI-generated summary of up to 100 recent reviews
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkshopReviewSummary"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "503":
          $ref: "#/components/responses/InvalidRequest"
  /analyze-request:
    post:
      operationId: analyzeRequest
      tags: [hub]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceRequestInput"
      responses:
        "200":
          description: Mock model analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Analysis"
        "400":
          $ref: "#/components/responses/InvalidRequest"
  /conversations:
    get:
      operationId: listConversations
      tags: [hub]
      summary: List synthetic customer-technician conversations and their mock summaries
      responses:
        "200":
          description: Persisted demo conversations ordered by latest message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationList"
  /conversations/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      operationId: getConversationThread
      tags: [hub]
      summary: Get one persisted demo conversation and its transcript
      responses:
        "200":
          description: Conversation transcript, current mock analysis, and dispatch association
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationThread"
        "404":
          $ref: "#/components/responses/InvalidRequest"
  /conversations/{id}/messages:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    post:
      operationId: sendConversationMessage
      tags: [hub]
      summary: Append a simulated customer or technician message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversationMessageInput"
      responses:
        "200":
          description: Updated persisted thread and transcript
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationThread"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/InvalidRequest"
  /conversations/{id}/reply:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    post:
      operationId: sendTelegramReply
      tags: [hub]
      summary: Send a staff reply to a Telegram customer and record it in the thread
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelegramReplyInput"
      responses:
        "200":
          description: The delivered reply and updated conversation transcript
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationThread"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/InvalidRequest"
        "409":
          $ref: "#/components/responses/InvalidRequest"
        "429":
          $ref: "#/components/responses/InvalidRequest"
        "503":
          $ref: "#/components/responses/InvalidRequest"
        "504":
          $ref: "#/components/responses/InvalidRequest"
  /conversations/{id}/analyze:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    post:
      operationId: analyzeConversation
      tags: [hub]
      summary: Analyze only the selected conversation with the mock model
      responses:
        "200":
          description: Selected thread with analysis tied to the current message version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationThread"
        "404":
          $ref: "#/components/responses/InvalidRequest"
        "409":
          $ref: "#/components/responses/InvalidRequest"
  /approve-dispatch:
    post:
      operationId: approveDispatch
      tags: [hub]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DispatchInput"
      responses:
        "200":
          description: Updated hub state after atomic dispatch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HubData"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "409":
          $ref: "#/components/responses/InvalidRequest"
  /complete-dispatch:
    post:
      operationId: completeDispatch
      tags: [hub]
      summary: Complete an active dispatch and release its assigned technician
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DispatchCompletionInput"
      responses:
        "200":
          description: Updated hub state after atomic completion; consumed stock is unchanged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HubData"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/InvalidRequest"
        "409":
          $ref: "#/components/responses/InvalidRequest"
  /reset-technician:
    post:
      operationId: resetTechnicianAvailability
      tags: [hub]
      summary: Reset an unassigned Busy demo technician to Available
      description: Does not change technicians with a tracked active dispatch. Preserves unknown historical dispatches and leaves inventory unchanged.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TechnicianResetInput"
      responses:
        "200":
          description: Updated hub state and immutable availability-reset audit event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HubData"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/InvalidRequest"
        "409":
          $ref: "#/components/responses/InvalidRequest"
  /supplier-catalog:
    get:
      operationId: searchSupplierCatalog
      tags: [hub]
      summary: Search selected configured supplier JSON catalog feeds
      parameters:
        - name: query
          in: query
          required: true
          schema: { type: string, minLength: 2, maxLength: 120 }
        - name: supplier_ids
          in: query
          required: true
          style: form
          explode: true
          description: One or more IDs returned by /supplier-catalog/providers
          schema:
            type: array
            minItems: 1
            maxItems: 20
            items: { type: string, minLength: 1, maxLength: 80 }
      responses:
        "200":
          description: Per-supplier catalog results, including partial feed errors
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupplierCatalogSearch"
        "400":
          $ref: "#/components/responses/InvalidRequest"
    description: |
      Configure supported feeds with SUPPLIER_CATALOG_FEEDS as a JSON array of
      {id, name, endpoint, query_param?} records. Use public HTTPS endpoints.
      Each endpoint receives the search text in query_param (default "query")
      and must return {"offers":[{product_name, product_url, price_myr,
      availability_note?, package_quantity?, unit_label?, source_updated_at?}]}.
      Availability uses the SupplierCatalogOffer enum. Only normalized real
      supplier data is returned; missing availability is labeled "Not checked".
  /supplier-catalog/providers:
    get:
      operationId: listSupplierCatalogProviders
      tags: [hub]
      summary: List supplier catalog feeds configured for this workspace
      responses:
        "200":
          description: Suppliers with supported feeds
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupplierCatalogProviders"
  /supplier-quotes:
    get:
      operationId: listSupplierQuotes
      tags: [hub]
      summary: List manually captured current prices from other suppliers
      parameters:
        - name: query
          in: query
          required: true
          schema: { type: string, minLength: 2, maxLength: 120 }
      responses:
        "200":
          description: Saved price quotes with source and evidence links
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupplierQuoteList"
        "400":
          $ref: "#/components/responses/InvalidRequest"
    post:
      operationId: saveSupplierQuote
      tags: [hub]
      summary: Save a dated supplier offer for the workshop team to compare
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupplierQuoteInput"
      responses:
        "201":
          description: Saved supplier quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupplierOffer"
        "400":
          $ref: "#/components/responses/InvalidRequest"
  /reorder-drafts:
    get:
      operationId: listReorderDrafts
      tags: [hub]
      summary: List saved reorder drafts and approved requests
      responses:
        "200":
          description: Reorder records kept separately from van inventory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReorderDraftList"
    post:
      operationId: createReorderDraft
      tags: [hub]
      summary: Save a reorder draft from a selected stock line and supplier offer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderDraftInput"
      responses:
        "201":
          description: Saved reorder draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReorderDraft"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/InvalidRequest"
  /reorder-drafts/{id}/approve:
    post:
      operationId: approveReorderDraft
      tags: [hub]
      summary: Approve a reviewed reorder draft without changing van stock
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderApprovalInput"
      responses:
        "200":
          description: Approved reorder request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReorderDraft"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/InvalidRequest"
        "409":
          $ref: "#/components/responses/InvalidRequest"
components:
  responses:
    InvalidRequest:
      description: Invalid request or stale technician/inventory state
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiFailure"
  schemas:
    CustomerReview:
      type: object
      required: [id, rating, comment, created_at]
      properties:
        id: { type: integer, minimum: 1 }
        rating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string, minLength: 3, maxLength: 1000 }
        created_at: { type: string, format: date-time }
    WorkshopReviewInput:
      type: object
      required: [rating, comment]
      properties:
        rating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string, minLength: 3, maxLength: 1000 }
    WorkshopReviewList:
      type: object
      required: [reviews, review_count, average_rating]
      properties:
        reviews:
          type: array
          items: { $ref: "#/components/schemas/CustomerReview" }
        review_count: { type: integer, minimum: 0 }
        average_rating: { type: ["number", "null"], minimum: 1, maximum: 5 }
    WorkshopReviewSummary:
      type: object
      required: [overview, improvements, strengths, review_count, generated_at]
      properties:
        overview: { type: string, minLength: 1, maxLength: 400 }
        improvements:
          type: array
          maxItems: 5
          items: { type: string, minLength: 1, maxLength: 300 }
        strengths:
          type: array
          maxItems: 5
          items: { type: string, minLength: 1, maxLength: 300 }
        review_count: { type: integer, minimum: 1, maximum: 100 }
        generated_at: { type: string, format: date-time }
    TelegramStatus:
      type: object
      required: [configured, connected, bot_username, bot_url, error, last_received_at]
      properties:
        configured: { type: boolean }
        connected: { type: boolean }
        bot_username: { type: ["string", "null"] }
        bot_url: { type: ["string", "null"] }
        error: { type: ["string", "null"] }
        last_received_at: { type: ["string", "null"], format: date-time }
    ConversationSiteInput:
      type: object
      required: [customer_site_id]
      properties:
        customer_site_id: { $ref: "#/components/schemas/DemoSiteId" }
    ApiFailure:
      type: object
      required: [error]
      properties:
        error: { type: string }
    Technician:
      type: object
      required: [id, name, status, zone, van_id]
      properties:
        id: { type: integer }
        name: { type: string }
        status: { type: string, enum: [Available, Busy] }
        zone: { type: string }
        van_id: { type: integer }
        level: { type: integer, minimum: 1, maximum: 3 }
        experience_label: { type: string }
        rating: { type: number, minimum: 0, maximum: 5 }
        demo_completed_jobs: { type: integer, minimum: 0 }
        specialty: { type: string }
        lat: { type: number }
        lng: { type: number }
    InventoryItem:
      type: object
      required: [id, van_id, part_name, quantity]
      properties:
        id: { type: integer }
        van_id: { type: integer }
        part_name: { type: string }
        quantity: { type: integer, minimum: 0 }
    Activity:
      type: object
      required: [id, timestamp, action_details, approved_by, dispatch, completion_dispatch_id]
      properties:
        id: { type: integer }
        timestamp: { type: string }
        completion_dispatch_id:
          type: [integer, "null"]
          description: Original approval ID for a completion audit event; null otherwise.
        action_details: { type: string }
        approved_by: { type: string }
        dispatch:
          oneOf:
            - $ref: "#/components/schemas/SavedDispatch"
            - type: "null"
    DemoSiteId:
      type: string
      enum: [north, central, south]
    DemoCustomerSite:
      type: object
      description: Labeled synthetic coordinates, never live GPS.
      required: [id, label, area, lat, lng]
      properties:
        id: { $ref: "#/components/schemas/DemoSiteId" }
        label: { type: string }
        area: { type: string }
        lat: { type: number, minimum: -90, maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }
    SavedDispatch:
      type: object
      required: [tech_id, technician_name, van_id, parts, customer_site, status, completed_at, conversation_id]
      properties:
        status:
          type: string
          enum: [Active, Completed, Unknown]
          description: Unknown means an older assignment cannot safely be completed.
        completed_at: { type: [string, "null"] }
        tech_id: { type: integer }
        technician_name: { type: string }
        van_id: { type: integer }
        parts:
          type: array
          items: { type: string }
        customer_site: { $ref: "#/components/schemas/DemoCustomerSite" }
        conversation_id: { type: ["integer", "null"], minimum: 1 }
    HubData:
      type: object
      required: [technicians, inventory, activity_log]
      properties:
        technicians:
          type: array
          items: { $ref: "#/components/schemas/Technician" }
        inventory:
          type: array
          items: { $ref: "#/components/schemas/InventoryItem" }
        activity_log:
          type: array
          items: { $ref: "#/components/schemas/Activity" }
    ServiceRequestInput:
      type: object
      required: [text]
      properties:
        text: { type: string, minLength: 1, maxLength: 5000 }
    Analysis:
      type: object
      required: [issue, parts, urgency]
      properties:
        issue: { type: string }
        parts:
          type: array
          items: { type: string }
        urgency: { type: string, enum: [High, Med, Medium, Low] }
        is_fallback: { type: boolean }
        complexity: { $ref: "#/components/schemas/JobComplexity" }
        rationale: { type: string }
        analysis_source: { type: string, enum: [AI, Rules] }
    JobComplexity:
      type: string
      enum: [Easy, Normal, Hard]
    TechnicianRecommendations:
      type: object
      required: [analysis_message_id, complexity, recommended_technician_id, summary, source, routing_status, routing_message, candidates]
      properties:
        analysis_message_id: { type: integer }
        complexity: { $ref: "#/components/schemas/JobComplexity" }
        recommended_technician_id: { type: [integer, "null"] }
        summary: { type: string }
        source: { type: string, enum: [AI, Rules] }
        routing_status: { type: string, enum: [ready, partial, not_configured, unavailable] }
        routing_message: { type: string }
        candidates:
          type: array
          items: { $ref: "#/components/schemas/TechnicianCandidate" }
    TechnicianCandidate:
      type: object
      required: [technician_id, eligible, reason, distance_meters, duration_seconds, polyline]
      properties:
        technician_id: { type: integer }
        eligible: { type: boolean }
        reason: { type: string }
        distance_meters: { type: [number, "null"] }
        duration_seconds: { type: [number, "null"] }
        polyline: { type: [string, "null"] }
    TechnicianRoute:
      type: object
      required: [technician_id, customer_site_id, status, message, distance_meters, duration_seconds, polyline]
      properties:
        technician_id: { type: integer, minimum: 1 }
        customer_site_id: { type: string, enum: [north, central, south] }
        status: { type: string, enum: [ready, not_configured, unavailable] }
        message: { type: string }
        distance_meters: { type: [number, "null"] }
        duration_seconds: { type: [number, "null"] }
        polyline: { type: [string, "null"] }
    ConversationMessage:
      type: object
      required: [id, conversation_id, sender_role, sender_name, text, created_at]
      properties:
        id: { type: integer, minimum: 1 }
        conversation_id: { type: integer, minimum: 1 }
        sender_role: { type: string, enum: [Customer, Technician, Staff] }
        sender_name: { type: string, minLength: 1, maxLength: 120 }
        text: { type: string, minLength: 1, maxLength: 4096 }
        created_at: { type: string, format: date-time }
    ConversationMessageInput:
      type: object
      required: [sender_role, text]
      properties:
        sender_role: { type: string, enum: [Customer, Technician] }
        technician_id: { type: integer, minimum: 1 }
        text: { type: string, minLength: 1, maxLength: 2000 }
    TelegramReplyInput:
      type: object
      required: [text]
      properties:
        text: { type: string, minLength: 1, maxLength: 4096 }
    ConversationSummary:
      type: object
      required: [id, customer_name, subject, customer_site_id, technician_id, technician_name, mock_summary, latest_message, message_count, dispatch_activity_id, updated_at, source]
      properties:
        id: { type: integer, minimum: 1 }
        customer_name: { type: string }
        subject: { type: string }
        complexity: { $ref: "#/components/schemas/JobComplexity" }
        customer_site_id: { type: ["string", "null"], enum: [north, central, south, null] }
        source: { type: string, enum: [Demo, Telegram] }
        technician_id: { type: ["integer", "null"], minimum: 1 }
        technician_name: { type: ["string", "null"] }
        mock_summary: { type: string }
        latest_message: { $ref: "#/components/schemas/ConversationMessage" }
        message_count: { type: integer, minimum: 1 }
        dispatch_activity_id: { type: ["integer", "null"], minimum: 1 }
        updated_at: { type: string, format: date-time }
    ConversationList:
      type: object
      required: [conversations]
      properties:
        conversations:
          type: array
          items: { $ref: "#/components/schemas/ConversationSummary" }
    ConversationThread:
      allOf:
        - $ref: "#/components/schemas/ConversationSummary"
        - type: object
          required: [messages, latest_message_id, analyzed_through_message_id, analysis, can_send_telegram_reply]
          properties:
            messages:
              type: array
              items: { $ref: "#/components/schemas/ConversationMessage" }
            latest_message_id: { type: integer, minimum: 1 }
            analyzed_through_message_id: { type: ["integer", "null"], minimum: 1 }
            can_send_telegram_reply: { type: boolean }
            analysis:
              oneOf:
                - $ref: "#/components/schemas/Analysis"
                - type: "null"
    DispatchInput:
      type: object
      required: [tech_id, van_id, parts, approved_by, customer_site_id]
      properties:
        customer_site_id: { $ref: "#/components/schemas/DemoSiteId" }
        conversation_id: { type: integer, minimum: 1 }
        tech_id: { type: integer, minimum: 1 }
        van_id: { type: integer, minimum: 1 }
        parts:
          type: array
          minItems: 1
          maxItems: 50
          items: { type: string, minLength: 1, maxLength: 120 }
