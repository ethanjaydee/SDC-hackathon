openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /hub-data:
    get:
      operationId: getHubData
      tags: [hub]
      summary: Current synthetic dispatch hub state
      responses:
        "200":
          description: Technicians, inventory and immutable audit log
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HubData"
  /analyze-request:
    post:
      operationId: analyzeRequest
      tags: [hub]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceRequestInput"
      responses:
        "200":
          description: Mock model analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Analysis"
        "400":
          $ref: "#/components/responses/InvalidRequest"
  /approve-dispatch:
    post:
      operationId: approveDispatch
      tags: [hub]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DispatchInput"
      responses:
        "200":
          description: Updated hub state after atomic dispatch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HubData"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "409":
          $ref: "#/components/responses/InvalidRequest"
  /complete-dispatch:
    post:
      operationId: completeDispatch
      tags: [hub]
      summary: Complete an active dispatch and release its assigned technician
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DispatchCompletionInput"
      responses:
        "200":
          description: Updated hub state after atomic completion; consumed stock is unchanged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HubData"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/InvalidRequest"
        "409":
          $ref: "#/components/responses/InvalidRequest"
  /reset-technician:
    post:
      operationId: resetTechnicianAvailability
      tags: [hub]
      summary: Reset an unassigned Busy demo technician to Available
      description: Does not change technicians with a tracked active dispatch. Preserves unknown historical dispatches and leaves inventory unchanged.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TechnicianResetInput"
      responses:
        "200":
          description: Updated hub state and immutable availability-reset audit event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HubData"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/InvalidRequest"
        "409":
          $ref: "#/components/responses/InvalidRequest"
  /supplier-catalog:
    get:
      operationId: searchSupplierCatalog
      tags: [hub]
      summary: Search the directly accessible Malaysian supplier catalog
      parameters:
        - name: query
          in: query
          required: true
          schema: { type: string, minLength: 2, maxLength: 120 }
      responses:
        "200":
          description: Current listings with supplier page links and check time
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupplierCatalogSearch"
        "400":
          $ref: "#/components/responses/InvalidRequest"
  /supplier-quotes:
    get:
      operationId: listSupplierQuotes
      tags: [hub]
      summary: List manually captured current prices from other suppliers
      parameters:
        - name: query
          in: query
          required: true
          schema: { type: string, minLength: 2, maxLength: 120 }
      responses:
        "200":
          description: Saved price quotes with source and evidence links
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupplierQuoteList"
        "400":
          $ref: "#/components/responses/InvalidRequest"
    post:
      operationId: saveSupplierQuote
      tags: [hub]
      summary: Save a dated supplier offer for the workshop team to compare
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupplierQuoteInput"
      responses:
        "201":
          description: Saved supplier quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupplierOffer"
        "400":
          $ref: "#/components/responses/InvalidRequest"
components:
  responses:
    InvalidRequest:
      description: Invalid request or stale technician/inventory state
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiFailure"
  schemas:
    ApiFailure:
      type: object
      required: [error]
      properties:
        error: { type: string }
    Technician:
      type: object
      required: [id, name, status, zone, van_id]
      properties:
        id: { type: integer }
        name: { type: string }
        status: { type: string, enum: [Available, Busy] }
        zone: { type: string }
        van_id: { type: integer }
    InventoryItem:
      type: object
      required: [id, van_id, part_name, quantity]
      properties:
        id: { type: integer }
        van_id: { type: integer }
        part_name: { type: string }
        quantity: { type: integer, minimum: 0 }
    Activity:
      type: object
      required: [id, timestamp, action_details, approved_by, dispatch, completion_dispatch_id]
      properties:
        id: { type: integer }
        timestamp: { type: string }
        completion_dispatch_id:
          type: [integer, "null"]
          description: Original approval ID for a completion audit event; null otherwise.
        action_details: { type: string }
        approved_by: { type: string }
        dispatch:
          oneOf:
            - $ref: "#/components/schemas/SavedDispatch"
            - type: "null"
    DemoSiteId:
      type: string
      enum: [north, central, south]
    DemoCustomerSite:
      type: object
      description: Labeled synthetic coordinates, never live GPS.
      required: [id, label, area, lat, lng]
      properties:
        id: { $ref: "#/components/schemas/DemoSiteId" }
        label: { type: string }
        area: { type: string }
        lat: { type: number, minimum: -90, maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }
    SavedDispatch:
      type: object
      required: [tech_id, technician_name, van_id, parts, customer_site, status, completed_at]
      properties:
        status:
          type: string
          enum: [Active, Completed, Unknown]
          description: Unknown means an older assignment cannot safely be completed.
        completed_at: { type: [string, "null"] }
        tech_id: { type: integer }
        technician_name: { type: string }
        van_id: { type: integer }
        parts:
          type: array
          items: { type: string }
        customer_site: { $ref: "#/components/schemas/DemoCustomerSite" }
    HubData:
      type: object
      required: [technicians, inventory, activity_log]
      properties:
        technicians:
          type: array
          items: { $ref: "#/components/schemas/Technician" }
        inventory:
          type: array
          items: { $ref: "#/components/schemas/InventoryItem" }
        activity_log:
          type: array
          items: { $ref: "#/components/schemas/Activity" }
    ServiceRequestInput:
      type: object
      required: [text]
      properties:
        text: { type: string, minLength: 1, maxLength: 5000 }
    Analysis:
      type: object
      required: [issue, parts, urgency]
      properties:
        issue: { type: string }
        parts:
          type: array
          items: { type: string }
        urgency: { type: string, enum: [High, Med, Low] }
    DispatchInput:
      type: object
      required: [tech_id, van_id, parts, approved_by, customer_site_id]
      properties:
        customer_site_id: { $ref: "#/components/schemas/DemoSiteId" }
        tech_id: { type: integer, minimum: 1 }
        van_id: { type: integer, minimum: 1 }
        parts:
          type: array
          minItems: 1
          maxItems: 50
          items: { type: string, minLength: 1, maxLength: 120 }
        approved_by: { type: string, minLength: 1, maxLength: 80 }
    DispatchCompletionInput:
      type: object
      required: [dispatch_id, completed_by]
      properties:
        dispatch_id: { type: integer, minimum: 1 }
        completed_by: { type: string, minLength: 1, maxLength: 80 }
    TechnicianResetInput:
      type: object
      required: [technician_id, reset_by]
      properties:
        technician_id: { type: integer, minimum: 1 }
        reset_by: { type: string, minLength: 1, maxLength: 80 }
    SupplierOffer:
      type: object
      required: [id, search_term, part_name, part_number, product_name, supplier_name, product_url, shop_url, price_myr, package_quantity, minimum_order_packs, shipping_myr, checked_at, source_type, availability_note, trust_evidence_url, trust_evidence_note, quality_rating, quality_evidence_note]
      properties:
        id: { type: string }
        search_term: { type: string }
        part_name: { type: string }
        part_number: { type: ["string", "null"] }
        product_name: { type: string }
        supplier_name: { type: string }
        product_url: { type: string, format: uri }
        shop_url: { type: string, format: uri }
        price_myr: { type: number, minimum: 0 }
        package_quantity: { type: ["integer", "null"], minimum: 1 }
        minimum_order_packs: { type: ["integer", "null"], minimum: 1 }
        shipping_myr: { type: ["number", "null"], minimum: 0 }
        checked_at: { type: string, format: date-time }
        source_type: { type: string, enum: [live_catalog, captured_quote] }
        availability_note: { type: string }
        trust_evidence_url: { type: ["string", "null"], format: uri }
        trust_evidence_note: { type: ["string", "null"] }
        quality_rating: { type: integer, minimum: 1, maximum: 5 }
        quality_evidence_note: { type: string }
    SupplierCatalogSearch:
      type: object
      required: [query, supplier_name, checked_at, offers]
      properties:
        query: { type: string }
        supplier_name: { type: string }
        checked_at: { type: string, format: date-time }
        offers:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/SupplierOffer" }
    SupplierQuoteList:
      type: object
      required: [query, quotes]
      properties:
        query: { type: string }
        quotes:
          type: array
          items: { $ref: "#/components/schemas/SupplierOffer" }
    SupplierQuoteInput:
      type: object
      required: [search_term, part_name, product_name, supplier_name, product_url, price_myr, quality_rating, quality_evidence_note]
      properties:
        search_term: { type: string, minLength: 2, maxLength: 120 }
        part_name: { type: string, minLength: 2, maxLength: 120 }
        part_number: { type: ["string", "null"], minLength: 1, maxLength: 120 }
        product_name: { type: string, minLength: 2, maxLength: 200 }
        supplier_name: { type: string, minLength: 2, maxLength: 120 }
        product_url: { type: string, format: uri, maxLength: 2048 }
        price_myr: { type: number, exclusiveMinimum: 0, maximum: 1000000 }
        quality_rating: { type: integer, minimum: 1, maximum: 5 }
        quality_evidence_note: { type: string, minLength: 5, maxLength: 400 }
        package_quantity: { type: integer, minimum: 1, maximum: 100000 }
        minimum_order_packs: { type: integer, minimum: 1, maximum: 100000 }
        shipping_myr: { type: ["number", "null"], minimum: 0, maximum: 1000000 }
        trust_evidence_url: { type: string, format: uri, maxLength: 2048 }
        trust_evidence_note: { type: string, maxLength: 400 }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

