kind = "web"
previewPath = "/"
title = "Dispatch Hub"
description = "Managed preview for the current pulled Field Service Dispatch Hub, reusing its existing frontend and API without changing stored data."
version = "1.0.0"
id = "artifacts/dispatch-preview"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23464

[services.development]
run = "pnpm --filter @workspace/dispatch-hub run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/dispatch-hub", "run", "build" ]
serve = "static"
publicDir = "artifacts/dispatch-hub/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23464"
BASE_PATH = "/"
